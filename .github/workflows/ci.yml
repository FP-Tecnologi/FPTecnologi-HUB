name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  api:
    name: api (build · lint · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci --no-workspaces

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # No se conecta a una BD real: prisma generate solo necesita el
          # schema y una URL con formato válido.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

  web:
    name: web (build · lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-workspaces

      - name: Lint (next lint)
        run: npm run lint

      - name: Build
        run: npm run build
