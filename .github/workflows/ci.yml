name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  api:
    name: api (build · lint · test)
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts exige DATABASE_URL al cargarse (generate, build y tests); no se conecta a ninguna BD real.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci --no-workspaces

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

  web:
    name: ${{ matrix.app }} (tipos · build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Dashboard y webs públicas (Next 16). `lint` = tsc --noEmit: typescript-eslint aún no soporta TypeScript 7.
        app: [admin, web-fptecnologi, fimav-web, quamtu-web, kelqa-web, imaninki-web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci --no-workspaces

      - name: Tipos (tsc)
        run: npm run lint

      - name: Build
        run: npx next build --webpack
