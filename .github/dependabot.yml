version: 2
updates:
  # Dashboard (apps/admin) — Next.js / React / Tailwind
  - package-ecosystem: 'npm'
    directory: '/apps/admin'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      next-minor-patch:
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(web/deps)'
    labels:
      - 'dependencies'
      - 'web'

  # API (apps/api) — NestJS / Prisma
  - package-ecosystem: 'npm'
    directory: '/apps/api'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      minor-patch:
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(api/deps)'
    labels:
      - 'dependencies'
      - 'api'

  # Web pública FPTecnologi (apps/web-fptecnologi) — Next.js
  - package-ecosystem: 'npm'
    directory: '/apps/web-fptecnologi'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(web-fptecnologi/deps)'
    labels:
      - 'dependencies'
      - 'web'

  # Web pública Fimav Perú (apps/fimav-web) — Next.js
  - package-ecosystem: 'npm'
    directory: '/apps/fimav-web'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(fimav-web/deps)'
    labels:
      - 'dependencies'
      - 'web'

  # Web pública Quamtu (apps/quamtu-web) — Next.js
  - package-ecosystem: 'npm'
    directory: '/apps/quamtu-web'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(quamtu-web/deps)'
    labels:
      - 'dependencies'
      - 'web'

  # GitHub Actions usadas en los workflows del repo
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'chore(ci/deps)'
    labels:
      - 'dependencies'
      - 'ci'
