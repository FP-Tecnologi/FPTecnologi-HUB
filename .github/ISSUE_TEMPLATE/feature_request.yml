name: Feature request
description: Proponer una nueva funcionalidad o mejora
labels: ['enhancement']
body:
  - type: input
    id: area
    attributes:
      label: Área afectada
      description: apps/api, apps/admin, docs, etc.
    validations:
      required: true
  - type: textarea
    id: problema
    attributes:
      label: Problema / motivación
      description: ¿Qué necesidad de negocio o técnica cubre esto?
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
    validations:
      required: true
