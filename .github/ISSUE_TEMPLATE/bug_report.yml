name: Bug
description: Reportar un comportamiento incorrecto (no vulnerabilidades de seguridad)
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Para vulnerabilidades de seguridad usa el reporte privado en
        **Security → Advisories → Report a vulnerability** en vez de este
        formulario.
  - type: input
    id: area
    attributes:
      label: Área afectada
      description: apps/api, apps/admin, docs, etc.
    validations:
      required: true
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del problema
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
    validations:
      required: false
