    q('#opciones').innerHTML=grupos((k,i,n)=>`<button class="op" data-k="${k}" data-i="${i}" aria-pressed="${sel[k]===i}">${mini({...sel,[k]:i})}<b>${num(k,i)}</b> ${n}</button>`);
    document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===ver));
  }
  document.addEventListener('click',e=>{
    const o=e.target.closest('button'); if(!o)return;
    if(o.dataset.k){const {k,i}=o.dataset; sel[k]=+i; pintar(); q(`[data-k="${k}"][data-i="${i}"]`).focus({preventScroll:true});}
    else if(o.dataset.v){ver=o.dataset.v; pintar();}
    else if(o.id==='bajar'){const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([entero(sel,ver)],{type:'image/svg+xml'})); a.download=`fepi-${ORDEN.map(k=>num(k,sel[k])).join('-')}-${ver}-brazos.svg`; a.click();}
  });
  pintar();
}
</script></body></html>
